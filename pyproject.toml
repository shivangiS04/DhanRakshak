[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhanrakshak"
version = "1.0.0"
description = "AML mule-account detection: graph-enhanced ensemble learning for Indian retail banking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "Shivangi Singh" },
]
keywords = [
  "anti-money-laundering",
  "fraud-detection",
  "graph-features",
  "ensemble-learning",
  "fintech",
  "financial-crime",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business :: Financial",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  "scikit-learn>=1.0.0",
  "xgboost>=1.5.0",
  "networkx>=2.6.0",
  "pyarrow>=6.0.0",
  "scipy>=1.7.0",
  "joblib>=1.1.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.8.0"]
viz  = ["matplotlib>=3.4.0", "seaborn>=0.11.0"]
dev  = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/shivangiS04/DhanRakshak"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src_enhanced*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
